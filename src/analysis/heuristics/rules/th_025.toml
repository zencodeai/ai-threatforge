[heuristic]
rule_id = "TH-025"
name = "External actor reaches module without authentication"
description = """Detect modules that do not require authentication but are accessible \
through workflows involving external actors, creating spoofing risk through \
unauthenticated access paths."""
graph_pattern = """(a:ExternalActor)-[:PARTICIPATES_IN]->(w:Workflow)-[:INVOLVES_MODULE]->\
(m:Module {authentication_required:false})"""
target_type = "module"
severity_hint = "high"
frameworks = ["ATTACK"]
output_field_mapping = [
    "target_id <- module.id",
    "target_type <- 'module'",
    "actor <- external actor with access",
    "workflow <- workflow connecting actor to module",
    "rationale <- unauthenticated module reachable by external actor",
]

[materializer]
primary = "unauth_actor_modules"
sort_by = ["actor_id", "module_id"]
skip_if_empty = "module_id"
target_id_field = "module_id"
id_fields = ["actor_id", "module_id"]
rationale = "External actor can reach module that does not require authentication."

[materializer.evidence]
actor_id = "row.actor_id"
actor_name = "row.actor_name"
workflow_id = "row.workflow_id"
workflow_name = "row.workflow_name"
module_name = "row.module_name"

[materializer.affected]
workflows = ["row.workflow_id"]
objects = []
