<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 380" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="a" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="#64748b"/>
    </marker>
    <filter id="s" x="-4%" y="-4%" width="108%" height="112%">
      <feDropShadow dx="1" dy="2" stdDeviation="2" flood-opacity="0.1"/>
    </filter>
    <linearGradient id="gB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#dbeafe"/><stop offset="100%" stop-color="#bfdbfe"/>
    </linearGradient>
    <linearGradient id="gG" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e0e7ff"/><stop offset="100%" stop-color="#c7d2fe"/>
    </linearGradient>
    <linearGradient id="gY" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fef3c7"/><stop offset="100%" stop-color="#fde68a"/>
    </linearGradient>
    <linearGradient id="gRd" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fee2e2"/><stop offset="100%" stop-color="#fecaca"/>
    </linearGradient>
    <linearGradient id="gGn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#d1fae5"/><stop offset="100%" stop-color="#a7f3d0"/>
    </linearGradient>
    <linearGradient id="gV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ede9fe"/><stop offset="100%" stop-color="#ddd6fe"/>
    </linearGradient>
  </defs>

  <text x="390" y="28" text-anchor="middle" font-size="15" font-weight="700" fill="#1e293b">Risk Scoring Methodology</text>

  <!-- Threat Input -->
  <rect x="20" y="55" width="170" height="55" rx="8" fill="url(#gY)" stroke="#f59e0b" stroke-width="1.5" filter="url(#s)"/>
  <text x="105" y="78" text-anchor="middle" font-weight="600" fill="#92400e">Threat Report</text>
  <text x="105" y="96" text-anchor="middle" font-size="11" fill="#b45309">Per-threat records</text>

  <line x1="190" y1="82" x2="236" y2="82" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Factor extraction -->
  <rect x="240" y="45" width="180" height="75" rx="8" fill="url(#gB)" stroke="#3b82f6" stroke-width="1.5" filter="url(#s)"/>
  <text x="330" y="68" text-anchor="middle" font-weight="600" fill="#1e40af">Factor Extraction</text>
  <text x="330" y="86" text-anchor="middle" font-size="11" fill="#3b82f6">severity · exposure · privilege</text>
  <text x="330" y="102" text-anchor="middle" font-size="11" fill="#3b82f6">data criticality · exploitability</text>

  <line x1="420" y1="82" x2="466" y2="82" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Weighted scoring -->
  <rect x="470" y="45" width="170" height="75" rx="8" fill="url(#gRd)" stroke="#ef4444" stroke-width="1.5" filter="url(#s)"/>
  <text x="555" y="68" text-anchor="middle" font-weight="600" fill="#991b1b">Weighted Scoring</text>
  <text x="555" y="86" text-anchor="middle" font-size="11" fill="#dc2626">Σ (weight × factor)</text>
  <text x="555" y="102" text-anchor="middle" font-size="11" fill="#dc2626">Deterministic formula</text>

  <!-- Weight table -->
  <rect x="20" y="145" width="400" height="165" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" filter="url(#s)"/>
  <text x="220" y="168" text-anchor="middle" font-weight="700" font-size="12" fill="#334155">Factor Weights</text>
  <line x1="40" y1="177" x2="400" y2="177" stroke="#e2e8f0" stroke-width="1"/>

  <text x="50" y="197" font-size="12" fill="#475569">Likelihood</text>
  <rect x="160" y="185" width="75" height="16" rx="3" fill="#bfdbfe"/><text x="197" y="197" text-anchor="middle" font-size="11" font-weight="600" fill="#1e40af">0.25</text>

  <text x="50" y="219" font-size="12" fill="#475569">Impact</text>
  <rect x="160" y="207" width="60" height="16" rx="3" fill="#c7d2fe"/><text x="190" y="219" text-anchor="middle" font-size="11" font-weight="600" fill="#3730a3">0.20</text>

  <text x="50" y="241" font-size="12" fill="#475569">Exposure</text>
  <rect x="160" y="229" width="45" height="16" rx="3" fill="#fde68a"/><text x="182" y="241" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">0.15</text>

  <text x="50" y="263" font-size="12" fill="#475569">Privilege Sensitivity</text>
  <rect x="160" y="251" width="45" height="16" rx="3" fill="#fde68a"/><text x="182" y="263" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">0.15</text>

  <text x="50" y="285" font-size="12" fill="#475569">Data Criticality</text>
  <rect x="160" y="273" width="45" height="16" rx="3" fill="#fecaca"/><text x="182" y="285" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">0.15</text>

  <text x="50" y="297" font-size="12" fill="#475569">Exploitability</text>
  <rect x="160" y="295" width="30" height="16" rx="3" fill="#fecaca"/><text x="175" y="307" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">0.10</text>

  <!-- Priority bands -->
  <rect x="450" y="145" width="300" height="165" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1" filter="url(#s)"/>
  <text x="600" y="168" text-anchor="middle" font-weight="700" font-size="12" fill="#334155">Priority Bands</text>
  <line x1="470" y1="177" x2="730" y2="177" stroke="#e2e8f0" stroke-width="1"/>

  <rect x="470" y="187" width="80" height="22" rx="4" fill="#fecaca" stroke="#ef4444" stroke-width="1"/>
  <text x="510" y="202" text-anchor="middle" font-size="11" font-weight="600" fill="#991b1b">Critical</text>
  <text x="570" y="202" font-size="11" fill="#475569">score ≥ 0.85</text>

  <rect x="470" y="217" width="80" height="22" rx="4" fill="#fed7aa" stroke="#f97316" stroke-width="1"/>
  <text x="510" y="232" text-anchor="middle" font-size="11" font-weight="600" fill="#9a3412">High</text>
  <text x="570" y="232" font-size="11" fill="#475569">score ≥ 0.65</text>

  <rect x="470" y="247" width="80" height="22" rx="4" fill="#fde68a" stroke="#f59e0b" stroke-width="1"/>
  <text x="510" y="262" text-anchor="middle" font-size="11" font-weight="600" fill="#92400e">Medium</text>
  <text x="570" y="262" font-size="11" fill="#475569">score ≥ 0.40</text>

  <rect x="470" y="277" width="80" height="22" rx="4" fill="#d1fae5" stroke="#10b981" stroke-width="1"/>
  <text x="510" y="292" text-anchor="middle" font-size="11" font-weight="600" fill="#065f46">Low</text>
  <text x="570" y="292" font-size="11" fill="#475569">score &lt; 0.40</text>

  <!-- Arrow from scoring to output -->
  <line x1="555" y1="120" x2="555" y2="142" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- Output arrow -->
  <line x1="555" y1="310" x2="555" y2="340" stroke="#64748b" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="470" y="342" width="170" height="30" rx="6" fill="url(#gGn)" stroke="#10b981" stroke-width="1"/>
  <text x="555" y="362" text-anchor="middle" font-weight="600" font-size="12" fill="#065f46">Risk Report JSON</text>
</svg>
