<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 110" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="13">
  <defs>
    <marker id="ar" viewBox="0 0 10 6" refX="10" refY="3" markerWidth="10" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 3 L 0 6 z" fill="#94a3b8"/>
    </marker>
    <filter id="ds" x="-4%" y="-8%" width="108%" height="120%">
      <feDropShadow dx="0.5" dy="1.5" stdDeviation="1.5" flood-opacity="0.08"/>
    </filter>
  </defs>

  <!-- Step 1 -->
  <rect x="10" y="20" width="120" height="58" rx="8" fill="#dbeafe" stroke="#3b82f6" stroke-width="1.5" filter="url(#ds)"/>
  <text x="70" y="45" text-anchor="middle" font-weight="700" font-size="12" fill="#1e40af">TOML Model</text>
  <text x="70" y="62" text-anchor="middle" font-size="10" fill="#3b82f6">Architecture as code</text>

  <line x1="130" y1="49" x2="158" y2="49" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 2 -->
  <rect x="162" y="20" width="110" height="58" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5" filter="url(#ds)"/>
  <text x="217" y="45" text-anchor="middle" font-weight="700" font-size="12" fill="#3730a3">Validate</text>
  <text x="217" y="62" text-anchor="middle" font-size="10" fill="#6366f1">Pydantic schema</text>

  <line x1="272" y1="49" x2="300" y2="49" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 3 -->
  <rect x="304" y="20" width="110" height="58" rx="8" fill="#e0e7ff" stroke="#6366f1" stroke-width="1.5" filter="url(#ds)"/>
  <text x="359" y="45" text-anchor="middle" font-weight="700" font-size="12" fill="#3730a3">Graph</text>
  <text x="359" y="62" text-anchor="middle" font-size="10" fill="#6366f1">Neo4j traversal</text>

  <line x1="414" y1="49" x2="442" y2="49" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 4 -->
  <rect x="446" y="20" width="110" height="58" rx="8" fill="#fef3c7" stroke="#f59e0b" stroke-width="1.5" filter="url(#ds)"/>
  <text x="501" y="45" text-anchor="middle" font-weight="700" font-size="12" fill="#92400e">Threats</text>
  <text x="501" y="62" text-anchor="middle" font-size="10" fill="#b45309">ATT&amp;CK / ATLAS</text>

  <line x1="556" y1="49" x2="584" y2="49" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 5 -->
  <rect x="588" y="20" width="110" height="58" rx="8" fill="#fee2e2" stroke="#ef4444" stroke-width="1.5" filter="url(#ds)"/>
  <text x="643" y="45" text-anchor="middle" font-weight="700" font-size="12" fill="#991b1b">Risks</text>
  <text x="643" y="62" text-anchor="middle" font-size="10" fill="#dc2626">Weighted scoring</text>

  <line x1="698" y1="49" x2="726" y2="49" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#ar)"/>

  <!-- Step 6 -->
  <rect x="730" y="20" width="140" height="58" rx="8" fill="#d1fae5" stroke="#10b981" stroke-width="1.5" filter="url(#ds)"/>
  <text x="800" y="45" text-anchor="middle" font-weight="700" font-size="12" fill="#065f46">Analyst UI</text>
  <text x="800" y="62" text-anchor="middle" font-size="10" fill="#059669">Query + Observe</text>

  <!-- Subtitle -->
  <text x="440" y="102" text-anchor="middle" font-size="11" fill="#94a3b8" font-style="italic">Deterministic pipeline — every output is explainable and auditable</text>
</svg>
