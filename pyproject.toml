[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "threat-forge-ai"
version = "0.1.0"
description = "Model-driven threat modeling MVP"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
  "pydantic>=2.8,<3.0",
  "neo4j>=5.20,<6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0,<9.0",
]
observability = [
  "langsmith>=0.1,<1.0",
]
ui = [
  "streamlit>=1.35,<2.0",
]

[tool.setuptools.packages.find]
include = ["models*", "graph*", "analysis*", "agents*", "ui*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: marks tests that require external services",
]
